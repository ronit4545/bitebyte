server.port=${PORT:5000}
spring.application.name=bitebyte

# JSON database file (created from the bundled seed data on first run)
bitebyte.db-file=data/db.json
# Built React frontend (npm run build) and uploaded images
bitebyte.client-dist=../client/dist
bitebyte.uploads-dir=uploads

# JWT (secret must be at least 32 characters; override with the JWT_SECRET env variable)
bitebyte.jwt.secret=${JWT_SECRET:chefhaven-super-secret-key-2026-bitebyte-java}
bitebyte.jwt.expiry-days=7

spring.servlet.multipart.max-file-size=10MB
